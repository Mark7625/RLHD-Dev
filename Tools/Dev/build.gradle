// This script is applied to the RLHD project, so resolve the tool's folders relative to this file
def toolDir = buildscript.sourceFile.parentFile

sourceSets {
	developer {
		java.srcDirs = [new File(toolDir, 'java')]
		resources.srcDirs = [new File(toolDir, 'resources')]
	}
}

configurations {
	developerCompileOnly.extendsFrom(compileOnly)
	developerImplementation.extendsFrom(implementation)
	developerAnnotationProcessor.extendsFrom(annotationProcessor)
	developerRuntimeOnly.extendsFrom(runtimeOnly)
	developerCompileClasspath.extendsFrom(compileClasspath)
	developerRuntimeClasspath.extendsFrom(runtimeClasspath)
	developerRuntimeClasspath.extendsFrom(testRuntimeClasspath)
}

sourceSets.developer.compileClasspath = sourceSets.main.output + configurations.developerCompileClasspath
sourceSets.developer.runtimeClasspath = sourceSets.developer.output + sourceSets.main.output + configurations.developerRuntimeClasspath
sourceSets.test.runtimeClasspath += sourceSets.developer.output

def lwjglVersion = '3.3.2'
dependencies {
	add('developerImplementation', 'net.runelite:cache:1.13.+') {
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}

	add('developerImplementation', 'org.mockito:mockito-core:5.14.2')

	add('developerImplementation', platform("org.lwjgl:lwjgl-bom:$lwjglVersion"))
	add('developerImplementation', "org.lwjgl:lwjgl")
	add('developerImplementation', "org.lwjgl:lwjgl-assimp")

	def lwjglNatives = rootProject.ext.has('lwjglNatives') ? rootProject.ext.lwjglNatives : project.findProperty('lwjglNatives')
	if (lwjglNatives) {
		add('developerRuntimeOnly', "org.lwjgl:lwjgl::$lwjglNatives")
		add('developerRuntimeOnly', "org.lwjgl:lwjgl-assimp::$lwjglNatives")
	}
}

tasks.named('processDeveloperResources') {
	filesMatching('runelite-plugin.properties') {
		expand(version: project.version)
	}
}

tasks.register('simulatedRender', JavaExec) {
	group = 'application'
	description = 'Draws a cache scene with the real 117 HD renderer, without RuneLite'
	dependsOn tasks.named('classes'), tasks.named('developerClasses')
	classpath = sourceSets.developer.runtimeClasspath
	mainClass = 'rs117.hd.dev.sceneloader.standalone.ui.HdPreview'
	workingDir = project.rootProject.projectDir
	jvmArgs '-ea', '-Xmx2G'
	if (project.hasProperty('simArgs'))
		args project.property('simArgs').toString().split('\\s+')
}

tasks.register('benchmark', JavaExec) {
	group = 'verification'
	description = 'Times 117 HD drawing a cache scene, and writes the frame timers to a CSV'
	dependsOn tasks.named('classes'), tasks.named('developerClasses')
	classpath = sourceSets.developer.runtimeClasspath
	mainClass = 'rs117.hd.dev.sceneloader.standalone.headless.HdBenchmark'
	workingDir = project.rootProject.projectDir
	jvmArgs '-ea', '-Xmx2G'
	if (project.hasProperty('simArgs'))
		args project.property('simArgs').toString().split('\\s+')
}

tasks.register('developerJar', Jar) {
	dependsOn tasks.named('classes'), tasks.named('developerClasses'), tasks.named('processDeveloperResources')
	from sourceSets.developer.output
	archiveClassifier.set('developer')
	archiveFileName.set("${rootProject.name}-${project.version}-developer.jar")
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
